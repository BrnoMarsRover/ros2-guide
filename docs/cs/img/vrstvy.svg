<svg xmlns="http://www.w3.org/2000/svg" width="780" height="496" viewBox="0 0 780 496" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <title>Vrstvy ROS 2</title>
  <rect width="780" height="496" rx="12" fill="#ffffff"/>

  <!-- 1 · uživatelské nody -->
  <g stroke="#2e7d32" stroke-width="1.5" fill="#e8f5e9">
    <rect x="20" y="20" width="121" height="52" rx="8"/>
    <rect x="153" y="20" width="121" height="52" rx="8"/>
    <rect x="286" y="20" width="121" height="52" rx="8"/>
    <rect x="419" y="20" width="121" height="52" rx="8"/>
  </g>
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="80.5" y="51">turtlesim</text>
    <text x="213.5" y="51">teleop</text>
    <text x="346.5" y="51">kinematics</text>
    <text x="479.5" y="51">tvůj node</text>
  </g>

  <!-- 2 · klientské knihovny, 3 · rcl -->
  <g stroke="#1565c0" stroke-width="1.5" fill="#e3f2fd">
    <rect x="20" y="112" width="164" height="52" rx="8"/>
    <rect x="198" y="112" width="164" height="52" rx="8"/>
    <rect x="376" y="112" width="164" height="52" rx="8"/>
    <rect x="20" y="176" width="520" height="52" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="102" y="134" font-size="15" font-weight="bold">rclcpp</text>
    <text x="102" y="152" font-size="12">C++</text>
    <text x="280" y="134" font-size="15" font-weight="bold">rclpy</text>
    <text x="280" y="152" font-size="12">Python</text>
    <text x="458" y="134" font-size="15" font-weight="bold">ostatní</text>
    <text x="458" y="152" font-size="12">rclc, rclrs (Rust), …</text>
    <text x="280" y="198" font-size="15" font-weight="bold">rcl</text>
    <text x="280" y="216" font-size="12">společné jádro v C: nody, topicy, services, parametry</text>
  </g>

  <!-- 4 · rmw, 5 · DDS / Zenoh -->
  <g stroke="#ef6c00" stroke-width="1.5" fill="#fff3e0">
    <rect x="20" y="268" width="520" height="52" rx="8"/>
    <rect x="20" y="332" width="253" height="52" rx="8"/>
    <rect x="287" y="332" width="253" height="52" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="280" y="290" font-size="15" font-weight="bold">rmw</text>
    <text x="280" y="308" font-size="12">ROS middleware interface: jednotné rozhraní ke komunikaci</text>
    <text x="146.5" y="354" font-size="15" font-weight="bold">DDS</text>
    <text x="146.5" y="372" font-size="12">Fast DDS (výchozí), Cyclone DDS</text>
    <text x="413.5" y="354" font-size="15" font-weight="bold">Zenoh</text>
    <text x="413.5" y="372" font-size="12">rmw_zenoh</text>
  </g>

  <!-- 6 · OS -->
  <rect x="20" y="424" width="520" height="52" rx="8" stroke="#616161" stroke-width="1.5" fill="#eeeeee"/>
  <text x="280" y="446" font-size="15" font-weight="bold" text-anchor="middle">operační systém</text>
  <text x="280" y="464" font-size="12" text-anchor="middle">Linux, síť (UDP/TCP), sdílená paměť</text>

  <!-- oddělovače skupin -->
  <g stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="20" y1="92" x2="760" y2="92"/>
    <line x1="20" y1="248" x2="760" y2="248"/>
    <line x1="20" y1="404" x2="760" y2="404"/>
  </g>

  <!-- popisky skupin -->
  <g fill="none" stroke-width="2">
    <path d="M552 20 H560 V72 H552" stroke="#2e7d32"/>
    <path d="M552 112 H560 V228 H552" stroke="#1565c0"/>
    <path d="M552 268 H560 V384 H552" stroke="#ef6c00"/>
    <path d="M552 424 H560 V476 H552" stroke="#616161"/>
  </g>
  <g font-size="15" font-weight="bold">
    <text x="574" y="43">tvůj kód</text>
    <text x="574" y="167">klientská knihovna</text>
    <text x="574" y="323">komunikace</text>
    <text x="574" y="447">systém</text>
  </g>
  <g font-size="12" fill="#555555">
    <text x="574" y="61">nody, které spouštíš</text>
    <text x="574" y="185">API, které voláš z kódu</text>
    <text x="574" y="341">middleware, posílá data</text>
    <text x="574" y="465">na tom všechno běží</text>
  </g>
</svg>
