# Builds the container image and publishes it as ghcr.io/brnomarsrover/ros2-guide:jazzy.
# Pull requests only build it. Weekly rebuild picks up new ROS and Ubuntu packages.
name: image

on:
  push:
    branches: [main]
    paths: [container/**, .github/workflows/image.yml]
  pull_request:
    paths: [container/**, .github/workflows/image.yml]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # the image is ~5 GB, the runner's disk is tight
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        run: docker build -f container/Dockerfile -t ros2-guide:jazzy .

      - name: Check
        run: docker run --rm -v "$PWD:/guide:ro" ros2-guide:jazzy /guide/container/check.sh --headless

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr A-Z a-z)/ros2-guide
          docker tag ros2-guide:jazzy "$IMAGE:jazzy"
          docker tag ros2-guide:jazzy "$IMAGE:jazzy-$(date +%Y%m%d)"
          docker push "$IMAGE:jazzy"
          docker push "$IMAGE:jazzy-$(date +%Y%m%d)"
